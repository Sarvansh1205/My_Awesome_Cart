{% extends 'shop/basic.html' %}

{% block title %} {{product.product_name}} - My Awesome Cart {% endblock %}
{% block css %}

{% endblock %}

{% block body %}
<div class="container my-4">
    <div class="row">
        <div class="col-md-4">
            <div class="row">
                <img class="prodimg" src="/media/{{product.image}}" width="233px" height="385px">
            </div>
            <div class="row my-4">
                <button class="btn btn-primary my-2">Buy Now</button>
                <button class="btn btn-primary my-2">Add To Cart</button>
            </div>

        </div>
        <div class="col-md-8">
            <h5>{{product.product_name}}</h5>
            <p><b>MRP Rs.</b>{{product.price}}</p>
            <p>{{product.desc}}</p>

        </div>
    </div>

</div>
{% endblock %}

{% block js %}
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
  console.log('working');
  if (localStorage.getItem('cart') == null) {
    var cart = {};
  }
  else {
    
    cart = JSON.parse(localStorage.getItem('cart'));
    document.getElementById('cart').innerHTML = Object.keys(cart).length;
  }


  $('.cart').click(function() {

  console.log('clicked');
  var idstr = this.id.toString();
  console.log(idstr);
  if(cart[idstr] !=undefined){
    cart[idstr] = cart[idstr] + 1;
  }
  else{
    cart[idstr] = 1;
  }
  console.log(cart); 
  localStorage.setItem('cart', JSON.stringify(cart));
  
  });

  
var popcartBtn = document.getElementById('popcart');

var popover = new bootstrap.Popover(popcartBtn, {  
    content: '<h5>Cart for your items in my shopping cart...</h5>',
    trigger: 'click',              // show/hide on click
    placement: 'bottom',
    fallbackPlacements: [],
    html: true
});

// document.getElementById("popcart").setAttribute('data-bs-content', '<h5>cart</h5>');

</script>
{% endblock %}
