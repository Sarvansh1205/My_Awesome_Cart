<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %} {% endblock %}</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <style>
    .popover {
      max-width: 800px;
      white-space: normal;
    }

    
      {% block css %}

      {% endblock %}
  </style>

</head>

<body>
  {% load static %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/shop">My Awesome Cart</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active mx-2" aria-current="page" href="/shop">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2" href="/shop/about">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2" href="/shop/tracker">Tracker</a>
          </li>
          <li class="nav-item">
            <a class="nav-link mx-2" href="/shop/contact">Contact Us</a>
          </li>

        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        <button type="button" class="btn btn-secondary mx-2" id="popcart" data-bs-container="body"
          data-bs-toggle="popover" data-bs-placement="bottom" data-html="true" data-bs-content="Bottom popover">
          Cart(<span id="cart">0</span>)
        </button>
        
        <a href="/shop/checkout" style="color: white; text-decoration: none;"><button type="button" class="btn btn-success ">Checkout</button></a>

        <a href="/shop/login" style="color: white; text-decoration: none;"><button type="button" class="btn btn-success mx-2">Login</button></a>
        

      </div>
    </div>
  </nav>

  {% block body %} {% endblock %}


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script>
  

    if (localStorage.getItem('cart') == null) {
      var cart = {};
    }
    else {

      cart = JSON.parse(localStorage.getItem('cart'));
      document.getElementById('cart').innerHTML = Object.keys(cart).length;
    }


    $('.cart').click(function () {

      console.log('clicked');
      var idstr = this.id.toString();
      console.log(idstr);
      if (cart[idstr] != undefined) {
        cart[idstr] = cart[idstr] + 1;
      }
      else {
        cart[idstr] = 1;
      }
      console.log(cart);
      localStorage.setItem('cart', JSON.stringify(cart));

    });


    var popcartBtn = document.getElementById('popcart');

    var popover = new bootstrap.Popover(popcartBtn, {
      content: '<h5>Cart for your items in my shopping cart...</h5>',
      trigger: 'click',              // show/hide on click
      placement: 'bottom',
      fallbackPlacements: [],
      html: true
    });

    // document.getElementById("popcart").setAttribute('data-bs-content', '<h5>cart</h5>');

  </script>
  {% block js %} {% endblock %}
</body>

</html>
